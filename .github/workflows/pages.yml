# Publishes the built client preview (UbisAID/ubis-aid-preview, which has the
# Pexels photos) on the custom domain https://ubisaid.se.
# The preview is built with base path /ubis-aid-preview, so it is served under
# that folder and the root redirects to /ubis-aid-preview/sv/.
# Settings -> Pages -> Source must be "GitHub Actions".
name: Deploy ubisaid.se (GitHub Pages)

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UbisAID/ubis-aid-preview
          path: preview

      - name: Assemble site
        run: |
          rm -rf preview/.git
          mkdir site
          mv preview site/ubis-aid-preview
          cp site/ubis-aid-preview/404.html site/404.html
          touch site/.nojekyll
          echo "ubisaid.se" > site/CNAME
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="sv">
          <head>
          <meta charset="utf-8">
          <title>Ubis AID</title>
          <script>location.replace("/ubis-aid-preview/sv/");</script>
          <noscript><meta http-equiv="refresh" content="0; url=/ubis-aid-preview/sv/"></noscript>
          </head>
          <body><a href="/ubis-aid-preview/sv/">Ubis AID</a></body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
